[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app is a workspace of its own, so this one builds no web view.
exclude = ["apps"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
edge-adhesion = { path = "crates/edge-adhesion" }
edge-3mf = { path = "crates/edge-3mf" }
edge-arachne = { path = "crates/edge-arachne" }
edge-clip = { path = "crates/edge-clip" }
edge-config = { path = "crates/edge-config" }
edge-engine = { path = "crates/edge-engine" }
edge-extrusion = { path = "crates/edge-extrusion" }
edge-fuzzy = { path = "crates/edge-fuzzy" }
edge-gcode = { path = "crates/edge-gcode" }
edge-geom = { path = "crates/edge-geom" }
edge-mesh = { path = "crates/edge-mesh" }
edge-infill = { path = "crates/edge-infill" }
edge-medial = { path = "crates/edge-medial" }
edge-paint = { path = "crates/edge-paint" }
edge-perimeter = { path = "crates/edge-perimeter" }
edge-slice = { path = "crates/edge-slice" }
edge-support = { path = "crates/edge-support" }
edge-template = { path = "crates/edge-template" }
edge-time = { path = "crates/edge-time" }
edge-tower = { path = "crates/edge-tower" }
# Voronoi diagrams of line segments, a port of Boost.Polygon's. Only
# edge-medial may depend on it.
boostvoronoi = "0.12"
clap = { version = "4", features = ["derive", "env"] }
clipper2-rs = "0.3"
quick-xml = "0.42"
rayon = "1"
rustc-hash = "2"
serde_json = "1"
tempfile = "3"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

# Tests run every preset and project in the reference; optimising the
# dependencies (clipping, XML, zip) keeps that to seconds without making
# this workspace's own code harder to debug.
[profile.dev.package."*"]
opt-level = 2

# The Voronoi library checks in a debug build that no number it works
# with is a NaN, and stops if one is. One turns up now and then, as it
# does in Boost's own: the square root of a determinant that rounding
# has left a hair under nothing, in the quick form of a circle event
# (`lazy_circle_formation::pss`). Which events are tried depends on the
# library's skip list, whose levels are random, so the same outline
# stopped a test on one run in three and not on the others (the Voron
# cube's layer at 11.3 mm). A release build has no such check and gives
# the same walls every run; tests are held to what ships.
[profile.dev.package.boostvoronoi]
opt-level = 2
debug-assertions = false

# Light optimisation for this workspace's own code as well: the tests that
# run whole projects spend their time in it.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
