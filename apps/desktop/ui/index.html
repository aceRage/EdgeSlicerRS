<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="edge-token" content="__EDGE_TOKEN__">
<title>EdgeSlicerRS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <header>
    <h1>EdgeSlicerRS</h1>
  </header>

  <section aria-labelledby="h-model">
    <h2 id="h-model">Model</h2>
    <button id="open" type="button">Open a model…</button>
    <form id="ask" hidden>
      <label for="ask-text" id="ask-label"></label>
      <input id="ask-text" type="text" autocomplete="off" spellcheck="false">
      <div class="row">
        <button type="submit" class="primary">OK</button>
        <button type="button" id="ask-cancel">Cancel</button>
      </div>
    </form>
    <p id="model-name" class="quiet">Nothing open. An STL or a 3MF project.</p>
    <label id="plate-row" hidden>Plate
      <select id="plate"></select>
    </label>
  </section>

  <section aria-labelledby="h-settings">
    <h2 id="h-settings">Settings</h2>
    <label>Sliced with
      <select id="source">
        <option value="project">the project's own settings</option>
        <option value="presets">presets chosen here</option>
      </select>
    </label>
    <p id="project-presets" class="quiet" hidden></p>
    <div id="presets">
      <label>Vendor <select id="vendor"></select></label>
      <label>Printer <select id="machine"></select></label>
      <label>Process <select id="process"></select></label>
      <div id="filaments"></div>
    </div>
    <label>Bed surface
      <select id="bed">
        <option value="">as the project or the printer has it</option>
        <option>Cool Plate</option>
        <option>Engineering Plate</option>
        <option>High Temp Plate</option>
        <option>Textured PEI Plate</option>
        <option>Textured Cool Plate</option>
        <option>Supertack Plate</option>
      </select>
    </label>
  </section>

  <section>
    <div class="row">
      <button id="slice" type="button" class="primary" disabled>Slice</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </div>
    <div id="progress" hidden><div id="bar"></div></div>
    <p id="status" role="status" class="quiet"></p>
  </section>

  <section id="result" aria-labelledby="h-print" hidden>
    <h2 id="h-print">Print</h2>
    <dl id="figures"></dl>
    <p id="gcode-error" class="error" hidden></p>
    <ul id="problems" class="error"></ul>
    <button id="export" type="button">Export G-code…</button>
    <p id="exported" class="quiet"></p>
    <ul id="remarks" class="plain"></ul>
    <details id="gaps">
      <summary></summary>
      <p class="quiet">The profile turns these on. The print goes ahead without them.</p>
      <ul></ul>
    </details>
  </section>

  <footer>
    <p class="quiet">Profiles: <span id="profiles-dir">none</span></p>
    <button id="profiles" type="button" class="link">Change…</button>
  </footer>
</aside>

<main>
  <canvas id="view" aria-label="Layer preview"></canvas>
  <p id="empty">Open a model and slice it to look through its layers.</p>
  <div id="legend" hidden></div>
  <div id="fit" hidden>
    <button type="button" data-fit="part">Fit part</button>
    <button type="button" data-fit="bed">Fit bed</button>
  </div>
  <div id="layerbar" hidden>
    <button type="button" id="down" aria-label="Layer below">−</button>
    <input id="layer" type="range" min="0" max="0" value="0" aria-label="Layer">
    <button type="button" id="up" aria-label="Layer above">+</button>
    <output id="layer-label" for="layer"></output>
    <label class="inline">Colour by
      <select id="colour">
        <option value="feature">feature</option>
        <option value="filament">filament</option>
      </select>
    </label>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
