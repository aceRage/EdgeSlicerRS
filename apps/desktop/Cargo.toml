[package]
name = "edge-desktop"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "EdgeSlicerRS desktop app: several projects open at once, each prepared, sliced, looked through and exported"

# A workspace of its own: the engine's workspace builds and tests without
# Tauri or a web view.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edge-config = { path = "../../crates/edge-config" }
edge-engine = { path = "../../crates/edge-engine" }
edge-extrusion = { path = "../../crates/edge-extrusion" }
edge-gcode = { path = "../../crates/edge-gcode" }
edge-geom = { path = "../../crates/edge-geom" }
# The Centauri Carbon is sent the MD5 of each file it is sent (ElegooLink.cpp).
md-5 = "0.10.6"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Serves the same page to a browser (`--serve`), for working on the page
# and for checking it where no window can be opened.
tiny_http = "0.12"
# The Centauri Carbon is started over its websocket (SDCP); plain ws only,
# on a TcpStream of our own so every read is timed.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Sending to printers (`src/hosts`): a small blocking HTTP client, with
# time-outs of each kind and TLS through rustls, for "HTTPS CA File".
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
# A folder of its own for each test's settings and profiles.
tempfile = "3"
# To read back the 3MF files the exports write.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "deny"

# The engine is a dependency here, so this is what makes slicing quick in
# a debug build of the app.
[profile.dev.package."*"]
opt-level = 2

# As in the engine's workspace, where the reasons are: the Voronoi
# library's debug checks stop it on a broken diagram before the walls can
# mend it, and a debug build of the app should slice what the shipped
# one does. The optimisation level is the `"*"` table's.
[profile.dev.package.boostvoronoi]
debug-assertions = false

# As in the engine's workspace: the skip list under the Voronoi library
# with levels that do not depend on the run (`vendor/cpp_map`).
[patch.crates-io]
cpp_map = { path = "../../vendor/cpp_map" }

[profile.release]
lto = "thin"
codegen-units = 1
